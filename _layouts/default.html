<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>
  <link rel="stylesheet" href="/assets/css/main.css">
  <script>
    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'light' ? 'beige' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    }
  </script>
</head>
<body>
  <div class="site-wrapper">
    <header class="site-header">
      <a href="/" class="brand-logo">{{ site.title }}</a>
      <nav class="nav-links">
        <a href="/">About</a>
        <a href="/#essays">Essays</a>
        <a href="/#projects">Side Quests</a>
        <button class="theme-btn" onclick="toggleTheme()" aria-label="Toggle Theme">◐ Theme</button>
      </nav>
    </header>

    <main>
      {{ content }}
    </main>

    <footer class="site-footer">
      <p>© {{ site.time | date: '%Y' }} {{ site.title }}. Built with Jekyll & GitHub Pages.</p>
    </footer>
  </div>
</body>
</html>
